# Ключевые слова для лид-сканера (аналитика Telegram-ботов)
# Группы как в ТЗ: hot_ru, warm_ru, hot_en, warm_en, minus.
#
# Как работает поиск:
# - без учёта регистра и ё/е;
# - фразы пишутся в обычной форме: у русских слов окончания отрезаются
#   автоматически («аналитика бота» найдёт «аналитику ботов»,
#   «посевы не окупаются» — «посев не окупается»), у английских — конечное s;
# - слова фразы должны идти подряд, в том же порядке;
# - сообщение проходит, если есть фраза из hot/warm, нет минус-слов и в нём
#   не меньше telegram.min_words слов (settings.yaml).
# Файл перечитывается на лету — правки применяются без перезапуска.

hot_ru:
  - аналитика бота
  - аналитика для бота
  - статистика бота
  - аналитика мини-апп
  - метрики бота
  - utm в телеграм
  - метки для бота
  - deep link статистика
  - отследить откуда пришли подписчики
  - отслеживать рекламу в телеграм
  - сквозная аналитика телеграм
  - воронка в боте
  - конверсия бота
  - выгрузить базу бота
  - выгрузить пользователей бота

warm_ru:
  - не понимаю какая реклама окупается
  - закуп не окупается
  - посевы не окупаются
  - куда уходит бюджет
  - подписчики не покупают
  - отвал в боте
  - не доходят до оплаты
  - дорогой подписчик
  - слили бюджет
  - какой канал лучше сработал
  - как считать окупаемость посевов

hot_en:
  - telegram bot analytics
  - mini app analytics
  - tma analytics
  - bot statistics
  - track telegram ads
  - telegram ads attribution
  - deep link tracking
  - start parameter tracking
  - bot funnel
  - mini app retention
  - export bot users

warm_en:
  - which ads convert
  - telegram ads not converting
  - high cpa telegram
  - users drop off
  - low retention mini app
  - can't track conversions
  - where do my users come from
  - wasting ad budget

# Короткие корни: срабатывают, только если в том же сообщении есть
# слово из stems_context.
stems_ru:
  - окупа
  - отвал
  - аналитик
  - статистик
  - конверси
  - воронк

stems_context:
  - бот
  - мини-апп
  - телеграм
  - посев
  - закуп

minus:
  - вакансия
  - резюме
  - ищу работу
  - обучение
  - курс
  - продам базу
  - куплю базу
  - накрутка
  - hiring
  - job
  - course
