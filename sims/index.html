<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Pool Party — Sims</title>
<meta name="description" content="Мини-симулятор: газон, бассейн, лестница и живые персонажи. Следи, чтобы они не утонули!" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#1f6e3d; --panel:#13351f; --panel2:#1b4a2b;
    --accent:#ffcf3f; --accent2:#ff8f3f; --text:#eafff0; --danger:#ff5252;
    --coin:#ffd43b; --water:#35a7e0; --water2:#1f74c4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--panel);color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;overflow:hidden;
    user-select:none;-webkit-user-select:none;overscroll-behavior:none;}
  #app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;
    padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom)) 10px;}

  /* ---------- Верхняя панель ---------- */
  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .pill{background:var(--panel2);border-radius:999px;padding:7px 14px;font-weight:800;
    display:flex;align-items:center;gap:6px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .pill .ic{font-size:17px;}
  .pill.tap{cursor:pointer;}
  .pill.tap:active{transform:translateY(1px);}
  .title{margin-left:auto;font-size:13px;opacity:.7;font-weight:700;}

  /* ---------- Сцена ---------- */
  .stage-wrap{position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  #stage{
    position:relative;width:100%;max-width:460px;aspect-ratio:360/520;border-radius:18px;overflow:hidden;
    background:
      radial-gradient(120% 90% at 30% 10%, #83d85a 0%, #5bbd3e 45%, #3f9e2c 100%);
    box-shadow:inset 0 0 0 4px rgba(0,0,0,.12), 0 10px 30px rgba(0,0,0,.4);
    touch-action:manipulation;
  }
  /* текстура травы */
  #stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;
    background:repeating-linear-gradient(60deg,#2f7d20 0 2px,transparent 2px 9px),
               repeating-linear-gradient(-55deg,#2f7d20 0 2px,transparent 2px 11px);}
  /* дорожка-плитка снизу для вида */
  .fence{position:absolute;inset:0;pointer-events:none;border-radius:18px;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.08);z-index:8100;}
  /* ---- день/ночь ---- */
  .sky{position:absolute;inset:0;pointer-events:none;border-radius:18px;z-index:8000;
    background:#0a1a3c;opacity:0;transition:opacity .6s linear,background .6s linear;}
  .stars{position:absolute;inset:0;pointer-events:none;border-radius:18px;z-index:8050;opacity:0;
    transition:opacity .8s linear;}
  .stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
    box-shadow:0 0 3px #fff;animation:tw 2.5s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.3;}50%{opacity:1;}}
  .celestial{position:absolute;font-size:26px;z-index:8060;pointer-events:none;
    transform:translate(-50%,-50%);filter:drop-shadow(0 0 8px rgba(255,220,120,.7));transition:none;}

  /* ---------- Бассейн ---------- */
  .pool{position:absolute;border-radius:14px;overflow:hidden;
    box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 0 0 5px #cfe7f5, inset 0 0 0 9px #a7cfe8;}
  .pool .water{position:absolute;inset:0;
    background:linear-gradient(180deg,var(--water) 0%,var(--water2) 100%);}
  .pool .water::after{content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(100deg,rgba(255,255,255,.35) 0 6px,transparent 6px 22px);
    animation:wave 3.5s linear infinite;}
  @keyframes wave{to{background-position:120px 0;}}
  .pool.danger .water{background:linear-gradient(180deg,#3a7fb0,#1a4a73);}
  /* лестница */
  .ladder{position:absolute;width:26px;height:34px;z-index:50;}
  .ladder .rail{position:absolute;top:0;bottom:0;width:5px;background:#e6e6e6;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.4);}
  .ladder .rail.l{left:3px;} .ladder .rail.r{right:3px;}
  .ladder .rung{position:absolute;left:3px;right:3px;height:4px;background:#d0d0d0;border-radius:2px;}
  .ladder .rung:nth-child(3){top:7px;} .ladder .rung:nth-child(4){top:16px;} .ladder .rung:nth-child(5){top:25px;}
  .no-ladder{position:absolute;width:26px;height:10px;z-index:49;border-radius:4px;
    background:repeating-linear-gradient(45deg,rgba(255,82,82,.9) 0 5px,rgba(120,0,0,.9) 5px 10px);
    animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:.35;}}

  /* ---------- Декор ---------- */
  .decor{position:absolute;font-size:30px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));
    transform:translate(-50%,-100%);pointer-events:none;}

  /* ---------- Сим ---------- */
  .sim{position:absolute;left:0;top:0;width:44px;height:58px;cursor:pointer;}
  .sim .shadow{position:absolute;left:50%;bottom:-2px;width:30px;height:9px;transform:translateX(-50%);
    background:rgba(0,0,0,.28);border-radius:50%;filter:blur(1px);}
  .sim .body{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:26px;height:24px;border-radius:10px 10px 8px 8px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);}
  .sim .head{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font-size:26px;line-height:1;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.3));}
  .sim .ring{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:40px;height:16px;
    border:3px solid var(--accent);border-radius:50%;opacity:0;transition:opacity .15s;}
  .sim.sel .ring{opacity:1;animation:ringpulse 1.1s ease-in-out infinite;}
  @keyframes ringpulse{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.15);}}
  .sim .tag{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);white-space:nowrap;
    font-size:11px;font-weight:800;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:999px;display:none;}
  .sim.swimming .body{bottom:2px;}
  .sim.swimming{animation:bob 2.2s ease-in-out infinite;}
  @keyframes bob{0%,100%{margin-top:0;}50%{margin-top:3px;}}
  .sim.panic .tag{display:block;color:#fff;background:var(--danger);}
  .sim .pan{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);font-size:18px;display:none;}
  .sim.panic .pan{display:block;animation:shake .35s infinite;}
  @keyframes shake{0%,100%{transform:translateX(-50%) rotate(-12deg);}50%{transform:translateX(-50%) rotate(12deg);}}

  .fxwrap{position:absolute;left:0;top:0;z-index:9000;pointer-events:none;}
  .fxwrap .ghostInner{display:inline-block;font-size:30px;animation:riseUp 2.4s ease-out forwards;}
  .fxwrap .floatInner{display:inline-block;font-weight:800;color:#ffe066;font-size:15px;
    text-shadow:0 2px 2px rgba(0,0,0,.4);animation:floatUp 1.2s ease-out forwards;}
  @keyframes riseUp{0%{opacity:0;transform:translate(-50%,-100%) scale(.6);}
    20%{opacity:1;}100%{opacity:0;transform:translate(-50%,-260%) scale(1.1);}}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%);}
    15%{opacity:1;}100%{opacity:0;transform:translate(-50%,-180%);}}

  /* ---------- Нижняя панель ---------- */
  .toolbar{display:flex;gap:7px;margin-top:8px;}
  .tbtn{flex:1;background:var(--panel2);border:0;color:var(--text);border-radius:12px;
    padding:9px 4px;font-weight:800;font-size:12px;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:3px;box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .08s;}
  .tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
  .tbtn .ic{font-size:20px;}
  .tbtn:disabled{opacity:.4;}
  .tbtn.on{background:var(--accent);color:#3a2b00;}
  .tbtn.warn{background:var(--accent2);color:#3a1800;}

  .ctxbar{display:flex;gap:7px;margin-top:7px;min-height:0;}
  .ctxbar.hidden{display:none;}
  .cbtn{flex:1;background:#2a5e3b;border:0;color:var(--text);border-radius:10px;padding:9px 4px;
    font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);}
  .cbtn:active{transform:translateY(2px);}
  .cbtn.pool{background:var(--water2);}
  .cbtn.out{background:#2e9e59;}

  .hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.6);
    padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;z-index:200;display:none;}
  .hint.show{display:block;animation:fadeIn .2s;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  /* ---------- Тост ---------- */
  #toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(0,0,0,.82);
    color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:10000;
    opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;}
  #toast.show{opacity:1;}

  /* ---------- Магазин ---------- */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10001;display:none;
    align-items:flex-end;justify-content:center;}
  .modal.show{display:flex;}
  .sheet{background:var(--panel);width:100%;max-width:480px;border-radius:18px 18px 0 0;
    padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;
    box-shadow:0 -10px 30px rgba(0,0,0,.5);}
  .sheet h2{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:8px;}
  .sheet .close{margin-left:auto;background:#2a5e3b;border:0;color:#fff;border-radius:999px;
    width:32px;height:32px;font-size:18px;cursor:pointer;}
  .tabs{display:flex;gap:6px;margin:12px 0;}
  .tab{flex:1;background:var(--panel2);border:0;color:var(--text);padding:8px;border-radius:10px;
    font-weight:800;font-size:13px;cursor:pointer;}
  .tab.on{background:var(--accent);color:#3a2b00;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .card{background:var(--panel2);border-radius:14px;padding:10px 6px;text-align:center;position:relative;}
  .card .emo{font-size:38px;line-height:1;}
  .card .nm{font-size:12px;font-weight:800;margin:6px 0 4px;min-height:28px;display:flex;align-items:center;justify-content:center;}
  .card .buy{width:100%;border:0;border-radius:9px;padding:7px 4px;font-weight:800;font-size:12px;cursor:pointer;
    background:var(--accent);color:#3a2b00;}
  .card .buy.owned{background:#2e9e59;color:#fff;}
  .card .buy.equipped{background:#1b7a3f;color:#fff;}
  .card .buy:disabled{opacity:.5;}
  .card .price{display:inline-flex;align-items:center;gap:3px;}
  .who{display:flex;gap:8px;margin-bottom:10px;}
  .who .wbtn{flex:1;background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:8px;
    font-weight:800;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;gap:6px;}
  .who .wbtn.on{border-color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="pill"><span class="ic">🪙</span><span id="coins">0</span></div>
    <div class="pill"><span class="ic">🧍</span><span id="simCount">0</span></div>
    <div class="pill tap" id="timePill"><span class="ic" id="timeIc">☀️</span></div>
    <div class="pill tap" id="muteBtn"><span class="ic" id="muteIc">🔊</span></div>
    <div class="title">Pool Party 🏖️</div>
  </div>

  <div class="stage-wrap">
    <div id="stage">
      <div class="sky" id="sky"></div>
      <div class="stars" id="stars"></div>
      <div class="celestial" id="celestial">☀️</div>
      <div class="fence"></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>

  <!-- контекстная панель выбранного сима -->
  <div class="ctxbar hidden" id="ctxbar"></div>

  <!-- основная панель -->
  <div class="toolbar">
    <button class="tbtn" id="btnPool"><span class="ic">🏊</span><span id="btnPoolLabel">Бассейн</span></button>
    <button class="tbtn" id="btnLadder" disabled><span class="ic">🪜</span><span id="btnLadderLabel">Лестница</span></button>
    <button class="tbtn" id="btnShop"><span class="ic">🛍️</span>Магазин</button>
    <button class="tbtn" id="btnHelp"><span class="ic">❔</span>Как играть</button>
  </div>
</div>

<div id="toast"></div>

<!-- Магазин -->
<div class="modal" id="shop">
  <div class="sheet">
    <h2>🛍️ Магазин <button class="close" id="shopClose">✕</button></h2>
    <div style="font-size:13px;opacity:.8">Баланс: <b>🪙 <span id="coins2">0</span></b></div>
    <div class="tabs">
      <button class="tab on" data-tab="skins">🎨 Скины</button>
      <button class="tab" data-tab="pools">🏊 Бассейны</button>
      <button class="tab" data-tab="sims">🧍 Персонажи</button>
      <button class="tab" data-tab="decor">🌳 Декор</button>
    </div>
    <div id="whoRow" class="who"></div>
    <div class="grid" id="shopGrid"></div>
  </div>
</div>

<script>
/* =========================================================================
   Telegram init
   ========================================================================= */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor("#13351f");
  tg.setBackgroundColor&&tg.setBackgroundColor("#13351f");tg.disableVerticalSwipes&&tg.disableVerticalSwipes();}catch(e){}}
function haptic(t){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t||"light");}catch(e){}}

/* =========================================================================
   Звук (синтез через WebAudio — файлы не нужны, работает офлайн)
   ========================================================================= */
let audioCtx=null;
function ensureAudio(){
  try{
    if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
    if(audioCtx.state==="suspended")audioCtx.resume();
  }catch(e){}
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(saveMuted())return;
  ensureAudio();if(!audioCtx)return;
  const t=audioCtx.currentTime+(delay||0);
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
  g.gain.setValueAtTime(vol||0.18,t);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);o.stop(t+dur+0.02);
}
function saveMuted(){return save.muted;}
const sfx={
  splash(){tone(520,0.14,"sine",0.22,180);tone(300,0.12,"sine",0.14,120,0.05);},
  bubble(){ // «буль-буль» — несколько низких булькающих тонов вниз
    [ [280,0], [230,0.15], [190,0.3], [150,0.47] ].forEach(([f,d])=>tone(f,0.16,"sine",0.26,f*0.6,d));
  },
  coin(){tone(880,0.07,"square",0.14,1300);tone(1320,0.08,"square",0.12,1600,0.06);},
  click(){tone(420,0.05,"square",0.1,320);},
  evil(){tone(200,0.25,"sawtooth",0.14,90);}, // при снятии лестницы со пловцом
};

/* =========================================================================
   Данные: скины, декор
   ========================================================================= */
const SKINS = [
  {id:"classic", emoji:"🙂", body:"#4a90d9", name:"Классик",  price:0},
  {id:"girl",    emoji:"👧", body:"#e84f8c", name:"Подружка", price:0},
  {id:"boy",     emoji:"👦", body:"#2e86de", name:"Пацан",    price:0},
  {id:"red",     emoji:"🧑‍🦰", body:"#e67e22", name:"Рыжик",   price:10},
  {id:"cool",    emoji:"😎", body:"#2c3e50", name:"Крутыш",   price:15},
  {id:"cowboy",  emoji:"🤠", body:"#a0522d", name:"Ковбой",   price:20},
  {id:"ninja",   emoji:"🥷", body:"#222",    name:"Ниндзя",   price:25},
  {id:"princess",emoji:"👸", body:"#d63384", name:"Принцесса",price:30},
  {id:"alien",   emoji:"👽", body:"#2ecc71", name:"Пришелец", price:40},
  {id:"robot",   emoji:"🤖", body:"#7f8c8d", name:"Робот",    price:50},
  {id:"vampire", emoji:"🧛", body:"#6c3483", name:"Вампир",   price:60},
];
const skinById = id => SKINS.find(s=>s.id===id) || SKINS[0];

const DECOR = [
  {id:"tree",     emoji:"🌳", name:"Дерево",    price:30},
  {id:"flowers",  emoji:"🌷", name:"Цветы",     price:20},
  {id:"flamingo", emoji:"🦩", name:"Фламинго",  price:60},
  {id:"umbrella", emoji:"⛱️", name:"Зонт",      price:80},
  {id:"ball",     emoji:"🏐", name:"Мяч",       price:25},
  {id:"grill",    emoji:"🍖", name:"Гриль",     price:100},
];
const decorById = id => DECOR.find(d=>d.id===id);

const POOLS = [
  {id:"puddle",  emoji:"💧", name:"Лужа",    w:120, h:92,  price:0,
   water:"linear-gradient(180deg,#4fc3e8,#2a93c7)", rim:["#dff1fb","#bfe0f1"], radius:"16px"},
  {id:"classic", emoji:"🏊", name:"Классик", w:170, h:120, price:0,
   water:"linear-gradient(180deg,#35a7e0,#1f74c4)", rim:["#cfe7f5","#a7cfe8"], radius:"14px"},
  {id:"round",   emoji:"⭕", name:"Круглый", w:150, h:150, price:25,
   water:"linear-gradient(180deg,#43d6c4,#1fa7a0)", rim:["#e2fbf6","#bdeee6"], radius:"50%"},
  {id:"kids",    emoji:"🛟", name:"Детский", w:140, h:110, price:35,
   water:"linear-gradient(180deg,#7fe3a6,#39b36f)", rim:["#ffe08a","#ffc93c"], radius:"46px"},
  {id:"lagoon",  emoji:"🏝️", name:"Лагуна",  w:240, h:150, price:60,
   water:"linear-gradient(180deg,#36d1c4,#128a97)", rim:["#dff7f2","#a9e7df"], radius:"34px"},
  {id:"neon",    emoji:"🌌", name:"Неон",    w:200, h:140, price:90,
   water:"linear-gradient(180deg,#19d3ff,#0a4fd1)", rim:["#0c2233","#071726"], radius:"14px", glow:"rgba(25,211,255,.85)"},
  {id:"lava",    emoji:"🌋", name:"Лава",    w:180, h:130, price:120,
   water:"linear-gradient(180deg,#ff7a3c,#c81d4a)", rim:["#3a1200","#210a00"], radius:"14px", glow:"rgba(255,90,40,.75)"},
  {id:"mega",    emoji:"🌊", name:"Мега",    w:290, h:178, price:160,
   water:"linear-gradient(180deg,#2db6ef,#155fb0)", rim:["#cdeaf8","#9fd3ef"], radius:"26px"},
];
const poolTypeById = id => POOLS.find(p=>p.id===id) || POOLS[1];

const NEW_SIM_PRICE = 25;
const DROWN_MS = 3*60*1000; // 3 минуты

/* =========================================================================
   Сохранение (монеты, купленные скины, декор)
   ========================================================================= */
const SAVE_KEY = "poolparty_v1";
let save = {coins:120, ownedSkins:["classic","girl","boy"], decor:[],
  pools:["puddle","classic"], activePool:"classic", muted:false};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&typeof s==="object")save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* =========================================================================
   Состояние сцены
   ========================================================================= */
const W=360,H=520; // логические координаты
const stage=document.getElementById("stage");
let scale=1;
function recalcScale(){scale=stage.clientWidth/W;}
window.addEventListener("resize",recalcScale);

let pool=null;      // {x,y,w,h,el,waterEl,hasLadder,ladderEl,noLadderEl}
let sims=[];
let selected=null;
let buildMode=false;
let decorEls=[];
let nextId=1;

/* ---------- утилиты ---------- */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}
function inPoolRect(x,y,pad){if(!pool)return false;pad=pad||0;
  return x>pool.x-pad&&x<pool.x+pool.w+pad&&y>pool.y-pad&&y<pool.y+pool.h+pad;}
function randGrassPoint(){
  for(let i=0;i<40;i++){
    const x=20+Math.random()*(W-40), y=70+Math.random()*(H-110);
    if(!inPoolRect(x,y,16)) return {x,y};
  }
  return {x:40,y:90};
}

/* =========================================================================
   Бассейн и лестница
   ========================================================================= */
function placePool(cx,cy){
  const pt=poolTypeById(save.activePool);
  const w=pt.w,h=pt.h;
  const x=clamp(cx-w/2,14,W-w-14);
  const y=clamp(cy-h/2,70,H-h-20);
  const el=document.createElement("div");el.className="pool";

  stage.appendChild(el);
  pool={x,y,w,h,el,waterEl:water,hasLadder:true,ladderEl:null,noLadderEl:null,type:pt};
  el.style.zIndex=Math.floor(y+h);
  el.addEventListener("click",(e)=>{e.stopPropagation();onPoolTap();});

function removePool(){
  if(!pool)return;
  if(sims.some(s=>s.state==="swim"||s.state==="panic")){toast("Сначала вытащи всех из бассейна!");return;}
  // вернуть на прогулку тех, кто шёл к бассейну
  sims.forEach(s=>{if(s.state==="toPool"||s.state==="exit"){s.state="walk";s.target=randGrassPoint();s.idle=0.4;}});
  pool.el.remove();
  if(pool.ladderEl)pool.ladderEl.remove();
  if(pool.noLadderEl)pool.noLadderEl.remove();
  pool=null;
  if(selected)renderCtx();
  document.getElementById("btnLadder").disabled=true;
  document.getElementById("btnLadder").classList.remove("on");
  document.getElementById("btnPoolLabel").textContent="Бассейн";

function stylePool(){
  if(!pool||!pool.type)return;
  const pt=pool.type;
  pool.el.style.borderRadius=pt.radius;
  pool.waterEl.style.borderRadius=pt.radius;
  let bs=`0 6px 16px rgba(0,0,0,.35), inset 0 0 0 5px ${pt.rim[0]}, inset 0 0 0 9px ${pt.rim[1]}`;
  if(pt.glow)bs+=`, 0 0 22px ${pt.glow}`;

function resizePoolTo(pt){
  if(!pool)return;
  const cx=pool.x+pool.w/2, cy=pool.y+pool.h/2;

  pool.type=pt;

function ladderPoint(){ // точка у лестницы (снаружи, сверху бассейна)

}
function updateLadder(){
  if(!pool)return;

    if(pool.noLadderEl){pool.noLadderEl.remove();pool.noLadderEl=null;}
    if(!pool.ladderEl){

    pool.ladderEl.style.left=(pool.x+pool.w/2-13)+"px";

function toggleLadder(){

/* =========================================================================
   Игровой цикл
   ========================================================================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  updateDayNight(now);
  for(const sim of sims){
    stepSim(sim,dt,now);
    drawSim(sim);
  }
  requestAnimationFrame(loop);
}
function stepSim(sim,dt,now){
  const SPEED=46;
  const prevState=sim.state;
  if(sim.state==="toPool"&&!pool){sim.state="walk";sim.target=randGrassPoint();}
  if(sim.state==="walk"){
    moveTowards(sim,sim.target,SPEED*dt);
    if(dist(sim.x,sim.y,sim.target.x,sim.target.y)<4){
      sim.idle-=dt;
      if(sim.idle<=0){sim.target=randGrassPoint();sim.idle=0.6+Math.random()*2.2;}
    }
    // не заходить в бассейн на прогулке
    if(inPoolRect(sim.x,sim.y,6)){sim.target=randGrassPoint();}
  }
  else if(sim.state==="toPool"){
    moveTowards(sim,sim.target,SPEED*dt);
    if(dist(sim.x,sim.y,sim.target.x,sim.target.y)<6){
      sim.state="swim";sim.el.classList.add("swimming");
      sim.x=pool.x+20+Math.random()*(pool.w-40);
      sim.y=pool.y+pool.h/2+ (Math.random()*20-10);
      sfx.splash();
      if(!pool.hasLadder){sim.state="panic";sim.drownStart=now;}
    }
  }
  else if(sim.state==="swim"||sim.state==="panic"){
    // лёгкое плавание внутри бассейна
    sim.swimT+=dt;
    const cx=pool.x+pool.w/2, cy=pool.y+pool.h/2;
    sim.x=cx+Math.cos(sim.swimT*0.8)* (pool.w/2-24);
    sim.y=cy+Math.sin(sim.swimT*1.3)* (pool.h/2-20);
    if(sim.state==="panic"){
      const left=DROWN_MS-(now-sim.drownStart);
      if(left<=0){drown(sim);return;}
      const sec=Math.ceil(left/1000);
      const mm=Math.floor(sec/60), ss=String(sec%60).padStart(2,"0");
      sim.el.querySelector(".tag").textContent="😵 "+mm+":"+ss;
    }
  }
  else if(sim.state==="exit"){
    sim.el.classList.remove("swimming");
    moveTowards(sim,sim.target,SPEED*dt);
    if(dist(sim.x,sim.y,sim.target.x,sim.target.y)<5){
      sim.state="walk";sim.target=randGrassPoint();sim.idle=0.5;
    }
  }
  sim.el.classList.toggle("panic",sim.state==="panic");
  if(sim===selected && prevState!==sim.state) renderCtx();
}
function moveTowards(sim,t,step){
  const dx=t.x-sim.x, dy=t.y-sim.y, d=Math.hypot(dx,dy)||1;
  sim.x+=dx/d*Math.min(step,d);
  sim.y+=dy/d*Math.min(step,d);
  // отразить персонажа по направлению
  if(Math.abs(dx)>0.5){sim._flip=dx<0;}
}
function drawSim(sim){
  const swim=(sim.state==="swim"||sim.state==="panic");
  sim.el.style.transform=`translate(${sim.x}px,${sim.y}px) translate(-50%,-100%)`;
  if(sim.headEl)sim.headEl.style.transform="translateX(-50%)"+(sim._flip?" scaleX(-1)":"");
  sim.el.style.zIndex = swim ? Math.floor(pool.y+pool.h)+50 : Math.floor(sim.y);
}

/* =========================================================================
   Цикл день / ночь
   ========================================================================= */
const CYCLE_MS=120000; // полный день за 2 минуты
let dayStart=performance.now();
const skyEl=document.getElementById("sky");
const starsEl=document.getElementById("stars");
const celEl=document.getElementById("celestial");
function buildStars(){
  let h="";
  for(let i=0;i<46;i++){
    const x=(Math.random()*100).toFixed(1), y=(Math.random()*60).toFixed(1), d=(Math.random()*2.5).toFixed(2);
    h+=`<i style="left:${x}%;top:${y}%;animation-delay:${d}s"></i>`;
  }
  starsEl.innerHTML=h;
}
function updateDayNight(now){
  const phase=((now-dayStart)%CYCLE_MS)/CYCLE_MS;      // 0 = полдень
  const ang=phase*2*Math.PI;
  const darkness=(1-Math.cos(ang))/2;                   // 0 полдень .. 1 полночь
  skyEl.style.opacity=(darkness*0.62).toFixed(3);
  const col=darkness<0.6?[70,30,80]:[10,22,60];         // сумерки тёплые, ночь синяя
  skyEl.style.background=`rgb(${col[0]},${col[1]},${col[2]})`;
  starsEl.style.opacity=clamp((darkness-0.45)*2.4,0,1).toFixed(2);
  const isDay=darkness<0.5;
  const a=isDay?ang:ang-Math.PI;                        // светило всегда «над горизонтом» в свой период
  celEl.style.left=(50+42*Math.sin(a)).toFixed(1)+"%";
  celEl.style.top=(38-Math.cos(a)*26).toFixed(1)+"%";
  celEl.textContent=isDay?"☀️":"🌙";
  const ic=document.getElementById("timeIc");if(ic)ic.textContent=isDay?"☀️":"🌙";
}

function updateMuteIc(){document.getElementById("muteIc").textContent=save.muted?"🔇":"🔊";}
document.getElementById("muteBtn").addEventListener("click",()=>{
  save.muted=!save.muted;persist();updateMuteIc();
  if(!save.muted){ensureAudio();sfx.click();}
});
document.getElementById("timePill").addEventListener("click",()=>toast("☀️ Солнце ходит по небу — полный день за 2 минуты 🌙"));
document.getElementById("shopClose").addEventListener("click",closeShop);
document.getElementById("shop").addEventListener("click",(e)=>{if(e.target.id==="shop")closeShop();});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{shopTab=t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));renderShop();}));

function showHelp(){
  toast("Тапни персонажа → «В бассейн». Убери лестницу 🪜 — и у него 3 минуты. Монеты капают сами и за «погладить». Трать их в магазине 🛍️");
}

/* =========================================================================
   Старт
   ========================================================================= */
function start(){
  recalcScale();
  buildStars();
  updateMuteIc();
  createSim("classic");
  createSim("girl");
  createSim("boy");
  renderDecor();
  updateHud();
  dayStart=performance.now();
  requestAnimationFrame((t)=>{last=t;loop(t);});
  setTimeout(()=>toast("Поставь бассейн 🏊, отправь персонажа купаться и… убери лестницу 😏"),600);
}
start();
</script>
</body>
